spring.application.name=prueba-desarrolladorti-senior

# --- Base de datos en memoria (H2). Se reinicia en cada arranque. ---
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Las entidades no se cargan fuera de la transacción del servicio.
spring.jpa.open-in-view=false

# --- Reglas de negocio ---
# IPC usado en la renovación, como fracción (0.0520 = 5,20 %).
app.renovacion.ipc=0.0520
app.datos-demo=true

# --- Seguridad: header obligatorio x-api-key ---
app.seguridad.api-key=${API_KEY:123456}

# --- Servicio de edición del CORE (en esta prueba, el mock del mismo API) ---
app.core.url=http://localhost:${server.port:8080}/core-mock/evento

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
